<style>
  :root{

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){

    --accent:#3987e5; --crit:#e66767;

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--surface-0);color:var(--text-primary);

    -webkit-font-smoothing:antialiased}

    padding:30px 32px;max-width:520px;width:100%}
  h1{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
  p{margin:0 0 8px;color:var(--text-secondary);font-size:14px}
  .muted{color:var(--text-muted);font-size:12.5px;margin-top:14px}

    border-radius:5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all}
  .err{color:var(--crit)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

const box = document.getElementById('box');
const show = (title, body, err) => {
  box.innerHTML = '<h1' + (err ? ' class="err"' : '') + '>' + title + '</h1>' + body;
};
(async () => {
  // açar ?authKey=... və ya #authKey=... ilə verilə bilər
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const secret = q.get('authKey') || h.get('authKey');
  if (!secret){
    show('Giriş açarı lazımdır',
      '<p>Bu hesabatın datası şifrələnib. Açmaq üçün linkə giriş açarını əlavə et:</p>' +
      '<p><code>' + location.origin + location.pathname + '?authKey=&lt;açar&gt;</code></p>' +
      '<p class="muted">Açar sənə ayrıca verilir. Açarsız bu faylda oxunacaq data yoxdur — ' +
      'gizlədilmiş deyil, sadəcə şifrəlidir.</p>');
    return;
  }
  try {
    const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
    const iv = raw.slice(0, 12), data = raw.slice(12);
    const material = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret));
    const key = await crypto.subtle.importKey('raw', material, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    show('Açar səhvdir',
      '<p>Bu açarla data açılmadı. Linkin tam kopyalandığını yoxla — açar 64 simvoldur ' +
      'və sonu kəsilmiş ola bilər.</p>', true);
  }
})();
